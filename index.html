<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141a2e">
  <title>筒ビューア</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/css/stage.css?v=20261027-2">
  <link rel="stylesheet" href="assets/css/viewer.css?v=20261027-2">
</head>
<body>
  <main class="viewer" id="app">
    <div class="stage" id="stage"></div>

    <header class="topbar">
      <h1 class="title" id="title"></h1>
      <div class="top-right">
      <button type="button" class="round-btn" id="uiBtn" aria-pressed="false" aria-label="表示を隠す" title="表示を隠す（H）">
        <svg class="i-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="i-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 3.5l17 17M10.5 6.1A9 9 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-3 3.6M6.6 7.7C4 9.4 2.5 12 2.5 12s3.5 6 9.5 6c1.6 0 3-.4 4.2-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      </button>
      <div class="mode-switch" role="group" aria-label="表示方法">
        <button type="button" data-mode="cylinder" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7" ry="2.5"/><path d="M5 5.5v13c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-13"/></svg>
          <span>筒</span>
        </button>
        <button type="button" data-mode="flat" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/></svg>
          <span>平面</span>
        </button>
      </div>
      </div>
    </header>

    <nav class="layerbar" aria-label="レイヤーの表示切り替え" id="layerbar" hidden>
      <div class="layer-list" id="layerList"></div>
    </nav>

    <section class="layer-panel" id="layerPanel" aria-labelledby="layerPanelTitle" hidden>
      <div class="panel-head">
        <h2 id="layerPanelTitle">レイヤーの透明度</h2>
        <button type="button" class="icon-btn" id="panelClose" aria-label="閉じる">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <ul class="panel-list" id="panelList"></ul>
      <div class="panel-foot">
        <button type="button" class="text-btn" id="opacityReset">透明度を元に戻す</button>
      </div>
    </section>

    <section class="layer-panel hist-panel" id="histPanel" aria-labelledby="histPanelTitle" hidden>
      <div class="panel-head">
        <h2 id="histPanelTitle">日付を選ぶ</h2>
        <button type="button" class="icon-btn" id="histClose" aria-label="閉じる">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <ul class="hist-list" id="histList"></ul>
    </section>

    <footer class="controls" id="controls">
      <button type="button" class="icon-btn" id="autoBtn" aria-pressed="false" aria-label="自動回転">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5h3v14h-3zM13.5 5h3v14h-3z"/></svg>
      </button>
      <div class="dial" id="dialWrap">
        <canvas id="dial" aria-label="回転位置。ドラッグで回せます" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="359"></canvas>
      </div>
      <button type="button" class="icon-btn" id="resetBtn" aria-label="表示を元に戻す">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>
      </button>
      <button type="button" class="icon-btn" id="saveBtn" aria-label="画像を保存" title="画像を保存" aria-expanded="false" aria-controls="saveMenu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10.5M7.5 10l4.5 4.5 4.5-4.5M4.5 15.5v3h15v-3"/></svg>
      </button>
    </footer>

    <section class="save-menu" id="saveMenu" aria-label="画像の保存" hidden>
      <div class="save-main" id="saveMain">
        <button type="button" class="save-item" data-act="layers">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l8.5 4.3L12 12 3.5 7.8z"/><path d="M3.5 12l8.5 4.2 8.5-4.2M3.5 16.2l8.5 4.3 8.5-4.3"/></svg>
          <span><strong>レイヤー画像を保存</strong><small>レイヤーごとに、その名前でPNGを保存</small></span>
        </button>
        <button type="button" class="save-item" data-act="full" data-flat>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3 15.5l5-4 4 3 3-2 6 4.5"/></svg>
          <span><strong>地図全体を保存</strong><small data-note>今のレイヤーの表示で、地図全体をPNGに</small></span>
        </button>
        <button type="button" class="save-item" data-act="view" data-flat>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5V5h3.5M16.5 5H20v3.5M20 15.5V19h-3.5M7.5 19H4v-3.5"/><circle cx="12" cy="12" r="3.2"/></svg>
          <span><strong>表示範囲を保存</strong><small data-note>画面に映っている範囲をPNGに</small></span>
        </button>
      </div>
      <div class="save-layers" id="saveLayers" hidden>
        <div class="save-head">
          <button type="button" class="back-btn" id="saveBack" aria-label="戻る">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>
          </button>
          <h2>レイヤー画像を保存</h2>
        </div>
        <ul class="save-list" id="saveList"></ul>
        <div class="save-foot">
          <button type="button" class="text-btn" id="saveZip">すべてまとめて保存（ZIP）</button>
        </div>
      </div>
    </section>

    <p class="hint" id="hint" hidden></p>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="status" id="status" role="status"></div>
  </main>
  <noscript><p class="noscript">このページの表示には JavaScript が必要です。</p></noscript>
  <script type="module" src="assets/js/viewer.js?v=20261027-2"></script>
</body>
</html>
