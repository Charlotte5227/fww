<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141a2e">
  <title>筒ビューア</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/css/stage.css">
  <link rel="stylesheet" href="assets/css/viewer.css">
</head>
<body>
  <main class="viewer" id="app">
    <div class="stage" id="stage"></div>

    <header class="topbar">
      <h1 class="title" id="title"></h1>
      <div class="mode-switch" role="group" aria-label="表示方法">
        <button type="button" data-mode="cylinder" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7" ry="2.5"/><path d="M5 5.5v13c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-13"/></svg>
          <span>筒</span>
        </button>
        <button type="button" data-mode="flat" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/></svg>
          <span>平面</span>
        </button>
      </div>
    </header>

    <nav class="layerbar" aria-label="レイヤーの表示切り替え" id="layerbar" hidden>
      <div class="layer-list" id="layerList"></div>
    </nav>

    <footer class="controls" id="controls">
      <button type="button" class="icon-btn" id="autoBtn" aria-pressed="false" aria-label="自動回転">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5h3v14h-3zM13.5 5h3v14h-3z"/></svg>
      </button>
      <div class="dial" id="dialWrap">
        <canvas id="dial" aria-label="回転位置。ドラッグで回せます" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="359"></canvas>
      </div>
      <button type="button" class="icon-btn" id="resetBtn" aria-label="表示を元に戻す">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>
      </button>
    </footer>

    <p class="hint" id="hint" hidden></p>
    <div class="status" id="status" role="status"></div>
  </main>
  <noscript><p class="noscript">このページの表示には JavaScript が必要です。</p></noscript>
  <script type="module" src="assets/js/viewer.js"></script>
</body>
</html>
